[pytest]
# Discover tests only in the tests/ directory
testpaths = tests

# Add project root to sys.path so `from app.xxx import ...` resolves correctly
pythonpath = .

# Asyncio mode for pytest-asyncio (not used here since we use sync TestClient,
# but kept for future async test expansion)
asyncio_mode = auto

# Verbosity
addopts = -v --tb=short
